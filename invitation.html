<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="2026년 12월, 서울 강남구에서 열리는 연말파티 초대장.">
<meta property="og:title" content="2026 연말파티 초대장">
<meta property="og:description" content="12월 12일 또는 19일(토) 17:00, 서울 강남구.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>2026 연말파티 초대장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Pen+Script&display=swap">
<style>
  html { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  /* layout: 한 장짜리 초대장. 펜글씨 제목 → 움직이는 거리 그림 카드 → 표처럼 정리한 안내 → 손으로 적은 비고 */
  :root {
    --bg: #dfe3e7;        /* 겨울 하늘 회색: 그림 카드가 종이로 보이게 */
    --ink: #1d2230;       /* 푸른 먹색 */
    --muted: #596173;
    --line: #bcc3cc;
    --accent: #b8402e;    /* 그림 속 목도리·등불의 붉은색 */
    --ring: rgba(29, 34, 48, .12);
    --font-hand: 'Nanum Pen Script', 'Gaegu', cursive;
    --font-body: 'IBM Plex Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #12151e; --ink: #ece6d6; --muted: #9ba3b5; --line: #353c4e; --accent: #e37a64; --ring: rgba(236, 230, 214, .14); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #12151e; --ink: #ece6d6; --muted: #9ba3b5; --line: #353c4e; --accent: #e37a64; --ring: rgba(236, 230, 214, .14); color-scheme: dark; }

  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  .invite { max-width: 34rem; margin-inline: auto; padding-block: 26px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }

  .head { display: flex; flex-direction: column; gap: 2px; }
  .eyebrow { margin: 0; font-family: var(--font-hand); font-size: 1.75rem; line-height: 1; color: var(--accent); }
  h1 { margin: 0; font-family: var(--font-hand); font-weight: 400; font-size: clamp(3rem, 14vw, 4.6rem); line-height: .95; letter-spacing: -.01em; word-break: keep-all; text-wrap: balance; }
  .lead { margin: 6px 0 0; color: var(--muted); font-size: .98rem; }

  .card { width: 100%; max-width: 100%; aspect-ratio: 400 / 304; border-radius: 14px; overflow: hidden; background: #fdfcf8; touch-action: pan-y;
          box-shadow: 0 0 0 1px var(--ring), 0 18px 44px -20px rgba(20, 22, 32, .55); }
  #stage, #stage svg { display: block; width: 100%; height: 100%; }
  #stage svg .pp { fill: var(--paper, #fdfdfc); }
  #stage svg text { -webkit-user-select: none; user-select: none; }

  .label { margin: 0; font-size: .8rem; font-weight: 500; letter-spacing: .1em; color: var(--muted); }
  .facts { margin: 0; display: flex; flex-direction: column; }
  .row { display: grid; grid-template-columns: 4.9rem minmax(0, 1fr); align-items: baseline; column-gap: 12px; padding-block: 11px; border-top: 1px solid var(--line); }
  .row:last-child { border-bottom: 1px solid var(--line); }
  .row dd { margin: 0; font-weight: 500; font-size: 1.04rem; font-variant-numeric: tabular-nums; }
  .row small { display: block; font-weight: 400; font-size: .88rem; color: var(--muted); }
  .dates { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 4px; }
  .date { display: inline-flex; align-items: baseline; gap: 5px; padding: 0 12px 2px; border: 1.5px solid var(--ink); border-radius: 3px 9px 4px 8px; }
  .date b { font-family: var(--font-hand); font-weight: 400; font-size: 2.5rem; line-height: 1.05; }
  .date span { font-size: .86rem; font-weight: 500; }
  .or { font-size: .88rem; color: var(--muted); font-weight: 400; }

  .fees { display: flex; flex-direction: column; gap: 8px; }
  .fees-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .fees-head span { font-size: .88rem; color: var(--muted); }
  .opts { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .opts li { display: flex; flex-direction: column; justify-content: space-between; gap: 2px; padding: 4px 10px 2px; border-left: 1px solid var(--line); min-width: 0; }
  .opts li:first-child { padding-left: 0; border-left: 0; }
  .opts .name { font-size: .9rem; line-height: 1.35; word-break: keep-all; }
  .opts .fee { font-family: var(--font-hand); font-size: 2.5rem; line-height: 1.1; white-space: nowrap; }
  .opts .fee small { font-size: 1.5rem; }

  .notes { display: flex; flex-direction: column; gap: 4px; }
  .notes ul { list-style: none; margin: 0; padding: 0; font-family: var(--font-hand); font-size: 1.8rem; line-height: 1.22; }
  .notes li { padding-left: 1.1em; text-indent: -1.1em; }
  .notes li::before { content: "– "; color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main class="invite">
  <header class="head">
    <p class="eyebrow">초대장</p>
    <h1>2026 연말파티</h1>
    <p class="lead">올해 마무리, 강남에서 같이 해요.</p>
  </header>

  <div class="card"><div id="stage"></div></div>

  <dl class="facts">
    <div class="row">
      <dt class="label">일자</dt>
      <dd>2026년 12월
        <div class="dates">
          <span class="date"><b>12</b><span>일 (토)</span></span>
          <span class="or">또는</span>
          <span class="date"><b>19</b><span>일 (토)</span></span>
        </div>
      </dd>
    </div>
    <div class="row">
      <dt class="label">시간</dt>
      <dd>1차 17:00 – 21:00<small>2차는 알아서</small></dd>
    </div>
    <div class="row">
      <dt class="label">장소</dt>
      <dd>서울 강남구<small>가게 미정</small></dd>
    </div>
    <div class="row">
      <dt class="label">참석인원</dt>
      <dd>15명+ <small>예상</small></dd>
    </div>
  </dl>

  <section class="fees" aria-labelledby="fee-h">
    <div class="fees-head"><h2 class="label" id="fee-h">참가비</h2><span>장소마다 달라요</span></div>
    <ul class="opts">
      <li><span class="name">파티룸 + 배달</span><span class="fee">3<small>만 원+</small></span></li>
      <li><span class="name">파티룸 + 바베큐</span><span class="fee">5<small>만 원+</small></span></li>
      <li><span class="name">고깃집</span><span class="fee">0<small>원</small></span></li>
    </ul>
  </section>

  <section class="notes" aria-labelledby="note-h">
    <h2 class="label" id="note-h">비고</h2>
    <ul>
      <li>참가비는 1차만입니다~</li>
      <li>고깃집 추천받아요.</li>
      <li>강사님 초빙 시도 중.</li>
    </ul>
  </section>
</main>
